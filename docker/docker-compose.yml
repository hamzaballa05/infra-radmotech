services:
  app:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../app:/usr/share/nginx/html:ro

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app