services:
  vault:
    image: hashicorp/vault:1.18.3
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault:/vault/config:ro
      - vault_data:/vault/file
    command: server 
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    cgroup: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    entrypoint: ["/vault/fetch-grafana-secret.sh"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./vault/fetch-grafana-secret.sh:/vault/fetch-grafana-secret.sh:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    secrets:
      - vault_grafana_token
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - monitoring
      - frontend
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - monitoring
 
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring

  db:
    image: mysql:8.0
    restart: unless-stopped
    entrypoint: ["/vault/fetch-db-secret.sh"]
    environment:
      MYSQL_DATABASE: acadconf
    volumes:
      - db_data:/var/lib/mysql
      - ./vault/fetch-db-secret.sh:/vault/fetch-db-secret.sh:ro
    secrets:
      - vault_app_token
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    build:
      context: ../Acadconf
    restart: unless-stopped
    entrypoint: ["/vault/fetch-app-secret.sh"]
    environment:
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLUSER: root
      MYSQLDATABASE: acadconf
      UPLOAD_DIR: /tmp/uploads/
    volumes:
      - uploads_data:/tmp/uploads
      - ./vault/fetch-app-secret.sh:/vault/fetch-app-secret.sh:ro
    secrets:
      - vault_app_token
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - frontend
      - monitoring




  nginx:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend




secrets:
  vault_app_token:
    file: ./secrets/vault_app_token.txt
  vault_grafana_token:
    file: ./secrets/vault_grafana_token.txt

volumes:
  db_data:
  uploads_data:
  vault_data:
  prometheus_data:
  grafana_data:
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
