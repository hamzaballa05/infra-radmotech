<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AcadConf - Inscription')}"></head>
<body class="min-h-screen flex items-center justify-center p-4">

<main class="w-full max-w-[720px] bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
  <!-- Left panel -->
  <div class="hidden md:flex md:w-1/3 bg-[#1a3a5c] p-8 flex-col justify-between relative overflow-hidden">
    <div class="absolute -top-24 -left-24 w-64 h-64 bg-[#002444] rounded-full opacity-50 blur-3xl"></div>
    <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-[#002444] rounded-full opacity-50 blur-3xl"></div>
    <div class="relative z-10">
      <div class="text-xl font-bold text-blue-200 tracking-tight mb-2">AcadConf</div>
      <p class="text-xs text-blue-300">Portail Académique</p>
    </div>
    <div class="relative z-10 mt-auto">
      <p class="text-xs text-blue-300 italic">"Gérez vos soumissions et évaluations de recherche avec rigueur et simplicité."</p>
    </div>
  </div>

  <!-- Form container -->
  <div class="w-full md:w-2/3 p-8 sm:p-10">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Créer un compte</h1>
      <p class="text-sm text-gray-500">Rejoignez la plateforme pour gérer vos contributions académiques.</p>
    </header>

    <!-- Error -->
    <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm flex items-center gap-2">
      <span class="material-symbols-outlined text-red-500" style="font-size:18px">error</span>
      <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" th:object="${utilisateur}" method="post" class="space-y-4">
      <!-- Name row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1" for="prenom">Prénom <span class="text-red-500">*</span></label>
          <input class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 id="prenom" th:field="*{prenom}" required type="text"/>
          <div class="text-red-500 text-xs mt-1" th:errors="*{prenom}"></div>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1" for="nom">Nom <span class="text-red-500">*</span></label>
          <input class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 id="nom" th:field="*{nom}" required type="text"/>
          <div class="text-red-500 text-xs mt-1" th:errors="*{nom}"></div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs text-gray-500 mb-1" for="email">Adresse Email <span class="text-red-500">*</span></label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" style="font-size:18px">mail</span>
          <input class="w-full bg-gray-50 border border-gray-300 rounded pl-10 pr-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 id="email" th:field="*{email}" required type="email"/>
        </div>
        <div class="text-red-500 text-xs mt-1" th:errors="*{email}"></div>
      </div>

      <!-- Password -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1" for="motDePasse">Mot de passe <span class="text-red-500">*</span></label>
          <input class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 id="motDePasse" th:field="*{motDePasse}" required type="password" placeholder="Min. 8 caractères"/>
          <div class="text-red-500 text-xs mt-1" th:errors="*{motDePasse}"></div>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Confirmer mot de passe <span class="text-red-500">*</span></label>
          <input class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 name="confirmPassword" required type="password"/>
        </div>
      </div>

      <!-- Affiliation & Pays -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-gray-500 mb-1" for="affiliation">Affiliation (Université/Institut)</label>
          <input class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                 id="affiliation" th:field="*{affiliation}" type="text"/>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1" for="pays">Pays</label>
          <select class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors"
                  id="pays" th:field="*{pays}">
            <option value="">Sélectionner un pays</option>
            <option value="Maroc">Maroc</option>
            <option value="France">France</option>
            <option value="Canada">Canada</option>
            <option value="Belgique">Belgique</option>
            <option value="Sénégal">Sénégal</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
      </div>

      <!-- Role -->
      <div>
        <label class="block text-xs text-gray-500 mb-1" for="role">Rôle principal <span class="text-red-500">*</span></label>
        <div class="relative">
          <select class="w-full bg-gray-50 border border-gray-300 rounded px-3 py-2 text-sm text-gray-900 focus:outline-none focus:border-[#002444] focus:ring-1 focus:ring-[#002444] transition-colors appearance-none"
                  id="role" th:field="*{role}" required>
            <option value="">Choisir un rôle</option>
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
          </select>
          <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" style="font-size:20px">expand_more</span>
        </div>
        <div class="text-red-500 text-xs mt-1" th:errors="*{role}"></div>
      </div>

      <!-- Submit -->
      <div class="pt-3">
        <button class="w-full bg-[#002444] hover:bg-[#1a3a5c] text-white font-semibold py-2.5 rounded-lg transition-colors duration-200 flex justify-center items-center gap-2 text-sm"
                type="submit">
          Créer mon compte
          <span class="material-symbols-outlined" style="font-size:20px">arrow_forward</span>
        </button>
        <div class="mt-5 text-center">
          <p class="text-xs text-gray-500">
            Vous avez déjà un compte ?
            <a th:href="@{/login}" class="text-[#002444] font-semibold hover:underline ml-1">Se connecter</a>
          </p>
        </div>
      </div>
    </form>
  </div>
</main>
</body>
</html>
