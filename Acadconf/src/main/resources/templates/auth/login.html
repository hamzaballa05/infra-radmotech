<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AcadConf - Connexion')}"></head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-[#002444] to-[#1a3a5c]">

<div class="absolute inset-0 pointer-events-none opacity-5 bg-[radial-gradient(#ffffff_1px,transparent_1px)] bg-[size:24px_24px]"></div>

<div class="relative z-10 w-full max-w-md flex flex-col items-center px-4">
  <!-- Logo -->
  <div class="flex flex-col items-center mb-8 text-center">
    <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center backdrop-blur-sm border border-white/20 mb-4 shadow-lg">
      <span class="material-symbols-outlined text-white" style="font-size: 32px; font-variation-settings: 'FILL' 1;">school</span>
    </div>
    <h1 class="text-2xl font-bold text-white tracking-tight">AcadConf</h1>
    <p class="text-sm text-blue-200 mt-2 max-w-[280px]">Plateforme de Gestion de Conférences Académiques</p>
  </div>

  <!-- Card -->
  <div class="w-full bg-white rounded-xl shadow-2xl border border-white/10 overflow-hidden">
    <div class="p-8">
      <h2 class="text-xl font-semibold text-gray-900 mb-6">Connexion</h2>

      <!-- Error alert -->
      <div th:if="${param.error}" class="mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-red-500" style="font-size:18px">error</span>
        Email ou mot de passe incorrect.
      </div>
      <div th:if="${param.logout}" class="mb-4 p-3 bg-green-50 border border-green-200 rounded text-green-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-green-500" style="font-size:18px">check_circle</span>
        Vous avez été déconnecté avec succès.
      </div>
      <div th:if="${success}" class="mb-4 p-3 bg-green-50 border border-green-200 rounded text-green-700 text-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-green-500" style="font-size:18px">check_circle</span>
        <span th:text="${success}"></span>
      </div>

      <form th:action="@{/login}" method="post" class="flex flex-col gap-5">
        <!-- Email -->
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="email">Email Institutionnel</label>
          <input class="w-full h-10 px-3 bg-gray-50 rounded border border-gray-300 focus:border-blue-700 focus:ring-1 focus:ring-blue-700 outline-none transition-colors text-sm text-gray-900 placeholder:text-gray-400"
                 id="email" name="email" placeholder="nom@institution.edu" required type="email"/>
        </div>
        <!-- Password -->
        <div class="flex flex-col gap-1">
          <div class="flex justify-between items-center">
            <label class="text-xs font-medium text-gray-500 uppercase tracking-wide" for="password">Mot de passe</label>
          </div>
          <div class="relative">
            <input class="w-full h-10 pl-3 pr-10 bg-gray-50 rounded border border-gray-300 focus:border-blue-700 focus:ring-1 focus:ring-blue-700 outline-none transition-colors text-sm text-gray-900 placeholder:text-gray-400"
                   id="password" name="motDePasse" placeholder="••••••••" required type="password"/>
            <button class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center text-gray-400 hover:text-gray-600" type="button"
                    onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password'">
              <span class="material-symbols-outlined" style="font-size:20px">visibility</span>
            </button>
          </div>
        </div>
        <!-- Submit -->
        <button class="w-full h-11 mt-2 bg-[#002444] text-white text-base font-semibold rounded-lg hover:bg-[#1a3a5c] focus:outline-none focus:ring-2 focus:ring-blue-700 focus:ring-offset-2 transition-all duration-200 flex items-center justify-center shadow-sm"
                type="submit">Se connecter</button>
      </form>

      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <p class="text-sm text-gray-500">
          Nouveau sur la plateforme ?
          <a th:href="@{/register}" class="text-sm font-semibold text-[#002444] hover:underline ml-1">S'inscrire</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div class="absolute bottom-6 w-full text-center z-10 pointer-events-none">
  <p class="text-xs text-blue-200/60">INSEA 2025-2026</p>
</div>
</body>
</html>
