# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:acadconf}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver




# Connection pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update

    #modifier en prod#
spring.jpa.show-sql=true 

    #modifier en prod#
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false


    #modifier en prod#
spring.thymeleaf.cache=false

spring.thymeleaf.encoding=UTF-8

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Override with UPLOAD_DIR env var in production (modifier en prod)
app.upload.dir=${UPLOAD_DIR:./uploads/}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=7d
server.port=${PORT:8080}
spring.application.name=AcadConf


    #modifier en prod# 
logging.level.com.acadconf=DEBUG
logging.level.org.springframework.security=INFO
